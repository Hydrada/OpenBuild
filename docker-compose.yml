services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: openbuild
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: openbuild
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbuild"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://openbuild:${POSTGRES_PASSWORD:-change-me}@db:5432/openbuild
      OPENBUILD_ALLOW_SIGNUP: ${OPENBUILD_ALLOW_SIGNUP:-true}
      OPENBUILD_SECURE_COOKIES: ${OPENBUILD_SECURE_COOKIES:-false}
      OPENBUILD_BASE_URL: ${OPENBUILD_BASE_URL:-}
      OPENBUILD_SMTP_URL: ${OPENBUILD_SMTP_URL:-}
      OPENBUILD_MAIL_FROM: ${OPENBUILD_MAIL_FROM:-}
    volumes:
      - files:/data
    ports:
      - "${OPENBUILD_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  pgdata:
  files:
