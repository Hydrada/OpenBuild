# UNTESTED: Docker was not available on the development machine (see docs/KNOWN_LIMITATIONS.md).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: openbuild
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: openbuild
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbuild"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://openbuild:${POSTGRES_PASSWORD:-change-me}@db:5432/openbuild
      OPENBUILD_ALLOW_SIGNUP: ${OPENBUILD_ALLOW_SIGNUP:-true}
      OPENBUILD_SECURE_COOKIES: ${OPENBUILD_SECURE_COOKIES:-false}
    ports:
      - "3000:3000"

volumes:
  pgdata:
