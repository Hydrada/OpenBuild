services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: openbuild
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: openbuild
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbuild"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://openbuild:${POSTGRES_PASSWORD:-change-me}@db:5432/openbuild
      OPENBUILD_ALLOW_SIGNUP: ${OPENBUILD_ALLOW_SIGNUP:-true}
      OPENBUILD_SECURE_COOKIES: ${OPENBUILD_SECURE_COOKIES:-false}
      OPENBUILD_BASE_URL: ${OPENBUILD_BASE_URL:-}
      OPENBUILD_SMTP_URL: ${OPENBUILD_SMTP_URL:-}
      OPENBUILD_MAIL_FROM: ${OPENBUILD_MAIL_FROM:-}
      # Virus scanning: start with `docker compose --profile scan up -d` and set OPENBUILD_CLAMD=clamav:3310.
      OPENBUILD_CLAMD: ${OPENBUILD_CLAMD:-}
      OPENBUILD_SCAN_FAIL_OPEN: ${OPENBUILD_SCAN_FAIL_OPEN:-false}
    volumes:
      - files:/data
    ports:
      - "${OPENBUILD_PORT:-3000}:3000"
    restart: unless-stopped

  # Optional ClamAV daemon for upload scanning (profile "scan"). First start downloads signatures (a few minutes).
  clamav:
    image: clamav/clamav:1.4
    profiles: ["scan"]
    restart: unless-stopped

volumes:
  pgdata:
  files:
